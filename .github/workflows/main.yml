name: Build
run-name: ${{ github.event.inputs.version }} Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config" -DOPENSTEAMTOOL_VERSION="${{ github.event.inputs.version }}"

      - name: Build Release
        run: cmake --build build --config Release

      # Publish the built DLL + version pointer to the orphan `updates` branch so the
      # in-DLL self-updater can fetch it over the mirror chain (raw → jsDelivr →
      # lua.tools). Pushes to this same repo with the built-in GITHUB_TOKEN.
      - name: Publish update to updates branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ver  = "${{ github.event.inputs.version }}"
          $repo = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          $hash = (Get-FileHash ".\build\Release\OpenSteamTool.dll" -Algorithm SHA256).Hash.ToLower()

          git clone --branch updates --single-branch $repo pub
          if (-not (Test-Path pub/.git)) {   # first run: create the orphan branch
            Remove-Item -Recurse -Force pub -ErrorAction SilentlyContinue
            git clone $repo pub
            Push-Location pub
            git checkout --orphan updates
            git rm -rf . 2>$null
            Pop-Location
          }

          $dir = "pub/opensteamtool/$ver"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item ".\build\Release\OpenSteamTool.dll" "$dir/OpenSteamTool.dll" -Force
          [IO.File]::WriteAllText((Resolve-Path $dir).Path + "/OpenSteamTool.dll.sha256", $hash)
          $lines = @(
            "version = `"$ver`""
            "path    = `"opensteamtool/$ver/OpenSteamTool.dll`""
            "sha256  = `"$hash`""
          )
          Set-Content -Path "pub/opensteamtool/latest.toml" -Value $lines -Encoding ascii

          Push-Location pub
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -m "opensteamtool $ver"
          git push origin updates
          Pop-Location

      # latest.toml lives at a mutable branch path, so nudge jsDelivr to drop its cached
      # copy. Versioned DLL paths are immutable and never need purging.
      - name: Purge jsDelivr cache for pointer
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -UseBasicParsing `
              "https://purge.jsdelivr.net/gh/madoiscool/BetterSteamTools@updates/opensteamtool/latest.toml" | Out-Null
          } catch { Write-Host "jsDelivr purge failed (non-fatal): $_" }

      - name: Build Debug
        run: cmake --build build --config Debug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Release
          path: build/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Debug
          path: build/Debug/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Package Release
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Release.zip ".\build\Release\*" -mx5

      - name: Package Debug
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip ".\build\Debug\*" -mx5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Download `OpenSteamTool-${{ github.event.inputs.version }}-Release.zip` (or the `-Debug` variant if you need logging to `<steam>/opensteamtool directory`).

            Extract and copy `dwmapi.dll`, `xinput1_4.dll` and `OpenSteamTool.dll` to your Steam root directory (e.g. `C:\Program Files (x86)\Steam`).

            Create a Lua config directory (for example `C:\Program Files (x86)\Steam\config\stplug-in`) and place your Lua scripts there.
          files: |
            OpenSteamTool-${{ github.event.inputs.version }}-Release.zip
            OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip
